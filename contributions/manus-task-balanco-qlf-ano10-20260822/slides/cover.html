<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 1: Estrutura Jurídica e Governança - Resumo Executivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #0B0C15 0%, #1a1b2e 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            padding-top: 60px;
        }
        
        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 600px;
        }
        
        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .content-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 60px;
            gap: 30px;
        }
        
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            color: #D4AF37;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            color: #00E5FF;
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .metrics-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #D4AF37;
            padding-left: 20px;
            padding-top: 12px;
            padding-bottom: 12px;
        }
        
        .metric-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #FFFFFF;
            font-weight: 500;
        }
        
        .metric-value {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #00E5FF;
            font-weight: 700;
        }
        
        .cta {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #D4AF37;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="image-section">
            <img src="/home/ubuntu/qlf_qvt_conceito.png" alt="Quantum Legacy Foundation e Quantum Votes">
        </div>
        <div class="content-section">
            <div class="title">Alicerce para a Grande Transmutação</div>
            <div class="subtitle">Fase 1: Estrutura Jurídica e Governança</div>
            
            <div class="metrics-container">
                <div class="metric">
                    <span class="metric-label">Duração da Fase</span>
                    <span class="metric-value">120 Dias</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Orçamento Estimado</span>
                    <span class="metric-value">R$ 1.000.000</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Patrimônio Alocado</span>
                    <span class="metric-value">R$ 5 Bilhões</span>
                </div>
            </div>
            
            <div class="cta">Iniciando a Jornada Quântica</div>
        </div>
    </div>
</body>
</html>
