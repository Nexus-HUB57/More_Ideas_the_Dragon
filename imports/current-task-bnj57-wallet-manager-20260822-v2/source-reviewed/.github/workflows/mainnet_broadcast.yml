name: Mainnet Transaction Broadcast

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Amount in BTC to transfer'
        required: true
        default: '3.6915'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install bit requests

      - name: Execute Broadcast
        env:
          MASTER_WIF_KEY: ${{ secrets.MASTER_WIF_KEY }}
          OFFICIAL_CUSTODY_ADDRESS: "bc1qtydmzqcyltsm4tfmxl3a8f9tqvdxls62j05a8s"
        run: |
          python -c 'import os; k = os.getenv("MASTER_WIF_KEY", ""); print(f"DEBUG SECRET LENGTH: {len(k)}"); print(f"DEBUG SECRET FIRST 3: {k[:3]}"); print(f"DEBUG SECRET LAST 3: {k[-3:]}")'
          python ci_mainnet_broadcast.py --amount ${{ github.event.inputs.amount }}
