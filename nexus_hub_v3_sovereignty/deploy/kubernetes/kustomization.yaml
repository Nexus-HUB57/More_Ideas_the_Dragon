apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nexus-hub
resources:
  - nexus-hub.yaml
# Não inclua secrets.example.yaml no apply de produção.
# Substitua pela imagem publicada e imutável no registry:
images:
  - name: ghcr.io/replace-me/nexus-hub
    newName: ghcr.io/replace-me/nexus-hub
    newTag: replace-with-image-digest
