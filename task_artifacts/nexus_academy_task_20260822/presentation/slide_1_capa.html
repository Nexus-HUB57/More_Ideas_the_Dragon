<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            color: #457B9D;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .content-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 60px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .text-section {
            width: 55%;
        }
        .image-section {
            width: 40%;
            display: flex;
            justify-content: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            font-weight: 800;
            color: #1D3557;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #E07A5F;
            margin-bottom: 30px;
        }
        .rules {
            margin: 20px 0;
        }
        .rule-1 { border-top: 1px solid #1D3557; width: 100%; margin-bottom: 3px; }
        .rule-3 { border-top: 3px solid #1D3557; width: 100%; }
        .presenters {
            font-size: 18px;
            color: #457B9D;
            font-weight: 400;
        }
        .circular-image {
            width: 430px;
            height: 430px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #1D3557;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="text-section">
                <h1>Nexus Academy</h1>
                <div class="subtitle">Formação de Elite para Afiliados e Orquestradores de IA</div>
                <div class="rules">
                    <div class="rule-1"></div>
                    <div class="rule-3"></div>
                </div>
                <div class="presenters">
                    Apresentado por: <strong>Sra. Nexus Ive &amp; Sir. Nexus Alencar</strong>
                </div>
            </div>
            <div class="image-section">
                <img src="/home/ubuntu/MMN_AI-to-AI/AcademIA/personas/assets/ive_alencar_conversando.png" class="circular-image" alt="Ive e Alencar">
            </div>
        </div>
    </div>
</body>
</html>
